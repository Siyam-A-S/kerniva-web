<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1a1f4d" />
    <title>Kerniva: AI workspace for teams with no time to lose</title>
    <meta
      name="description"
      content="Kerniva connects your team’s research, files, AI sessions, and project decisions in real time, so the next collaborator can continue without reconstructing context."
    />
    <link rel="canonical" href="https://kerniva.app/" />

    <!-- Social cards. LinkedIn, Slack, and X ignore SVG, so og:image must stay a PNG. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kerniva" />
    <meta property="og:title" content="Kerniva: AI workspace for teams with no time to lose" />
    <meta
      property="og:description"
      content="Kerniva connects your team’s research, files, AI sessions, and project decisions in real time, so the next collaborator can continue without reconstructing context."
    />
    <meta property="og:url" content="https://kerniva.app/" />
    <meta property="og:image" content="https://kerniva.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kerniva: AI workspace for teams with no time to lose" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kerniva: AI workspace for teams with no time to lose" />
    <meta
      name="twitter:description"
      content="Research, files, AI sessions, and decisions stay connected to the project, so the next collaborator never starts over."
    />
    <meta name="twitter:image" content="https://kerniva.app/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
