name: Deploy
on:
  workflow_dispatch: {} # rollback path only — kerniva.app is served by Coolify (deploy-coolify.yml)
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'nonprod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload hashed assets (immutable)
        run: aws s3 sync dist/assets "s3://${{ vars.SITE_BUCKET }}/assets" --delete --cache-control "public,max-age=31536000,immutable"
      - name: Upload entry files (short cache)
        run: aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --exclude "assets/*" --delete --cache-control "public,max-age=60"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
