name: Security

# Dependency advisories and committed secrets. A workflow of its own, not a job
# in CI, on purpose: the deploy is gated on CI, and an advisory published
# against a dependency overnight must not block shipping an unrelated fix. It
# fails loudly here instead, and the weekly run catches advisories that appear
# while nobody is pushing.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Only what ships: `--prod` leaves out the build and test tooling, which
  # never reaches the image. The two packages have separate lockfiles, so each
  # is audited where its lockfile lives.
  dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [".", "api"]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level high

  # The whole history, not just the tip: a secret removed in a later commit is
  # still in the repository, and this repository is public.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: >
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source /repo --redact --no-banner --exit-code 1
