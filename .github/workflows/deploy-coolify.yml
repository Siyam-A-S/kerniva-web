name: site image (Coolify)

# Manual fallback: builds the kerniva.app image (static site) and publishes
# it to GHCR. Not used by the normal deploy path; Coolify's GitHub App
# builds this repo's Dockerfile from source on push. Keep for a registry-
# based rollback or a future move off build-from-source.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/kerniva-site:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/kerniva-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Notify Coolify
        if: "${{ vars.COOLIFY_WEBHOOK_URL != '' }}"
        env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          URL: ${{ vars.COOLIFY_WEBHOOK_URL }}
        run: 'curl -fsS -H "Authorization: Bearer $TOKEN" "$URL"'
