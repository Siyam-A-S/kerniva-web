name: site image (Coolify)

# Builds the kerniva.app image (static site) and publishes it to GHCR on
# every push to main, then pokes Coolify to pull it.
#
# This exists because the Coolify GitHub App's auto-deploy webhook cannot
# reach the instance: coolify.kerniva.app has no DNS record, so GitHub has
# nowhere to deliver the push event. This path does not need DNS, because
# the runner calls Coolify directly at whatever host COOLIFY_WEBHOOK_URL
# names, a raw IP:port included.
#
# The notify step stays skipped until repo variable COOLIFY_WEBHOOK_URL and
# secret COOLIFY_TOKEN are set, and Coolify only picks the image up once the
# application is switched from the Dockerfile build pack to Docker Image
# (ghcr.io/siyam-a-s/kerniva-site:latest). Until both are done this workflow
# publishes an image that nothing consumes, which is harmless.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/kerniva-site:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/kerniva-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Notify Coolify
        if: "${{ vars.COOLIFY_WEBHOOK_URL != '' }}"
        env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          URL: ${{ vars.COOLIFY_WEBHOOK_URL }}
        run: 'curl -fsS -H "Authorization: Bearer $TOKEN" "$URL"'
