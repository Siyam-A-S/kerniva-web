name: site image (Coolify)

# Builds the kerniva.app image (static site; the simulation is behind a
# waitlist) and publishes it to GHCR; Coolify redeploys on the webhook. The
# AWS/CloudFront workflow (deploy.yml) stays as a rollback path.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/kerniva-site:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/kerniva-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Notify Coolify
        if: "${{ vars.COOLIFY_WEBHOOK_URL != '' }}"
        env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          URL: ${{ vars.COOLIFY_WEBHOOK_URL }}
        run: 'curl -fsS -H "Authorization: Bearer $TOKEN" "$URL"'
