# kerniva.app behind Cloudflare → Azure Container Apps ingress. The marketing
# site and its forms API only: the product demo is a separate deployment.
# nginx discards server-level add_header inside a location that sets its own,
# so Cache-Control is chosen by a map and every header is declared once here.
map $uri $kerniva_cache_control {
  # Vite hashes everything under /assets/, so it can be cached forever.
  ~^/assets/                "public, max-age=31536000, immutable";
  # Media in public/ keeps a stable, unhashed name: cache it for a week
  # rather than revalidating a multi-megabyte film on every visit. Rename
  # the file to bust it.
  ~*\.(mp4|webm|m4v|mov)$   "public, max-age=604800";
  default                   "no-cache";
}

# Cloudflare passes the visitor's address in CF-Connecting-IP; $remote_addr is
# Cloudflare's own edge, so rate limiting on it would bucket every visitor
# together. The Container App's ingress only admits Cloudflare's address
# ranges (ingress_allowed_cidrs in infra/opentofu), so the header cannot be
# spoofed by a direct caller.
map $http_cf_connecting_ip $kerniva_client_ip {
  default $http_cf_connecting_ip;
  ""      $remote_addr;
}

# Form intake is the only write path on the site, so it gets its own bucket.
# The API applies its own sliding window as well; this is the cheap first cut.
limit_req_zone $kerniva_client_ip zone=kerniva_forms:1m rate=20r/m;

# Cloudflare tells us the visitor's scheme in CF-Visitor. The platform ingress
# in front of this container always speaks plain HTTP to us and reports the
# scheme of the Cloudflare-to-origin hop, not the visitor's. Bounce
# insecure visitors even if "Always Use HTTPS" is ever switched off at the edge.
map $http_cf_visitor $kerniva_insecure {
  default            0;
  '~"scheme":"http"' 1;
}

server {
  listen 80;
  server_name kerniva.app www.kerniva.app _;
  server_tokens off;
  root /srv/site;

  if ($host = www.kerniva.app) { return 301 https://kerniva.app$request_uri; }
  if ($kerniva_insecure) { return 301 https://$host$request_uri; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Cache-Control $kerniva_cache_control always;

  # For the host's liveness and readiness probes. It answers from nginx alone
  # and never touches the forms API: a probe on /api/health would mark the
  # whole container unhealthy whenever the API restarts, and the site must
  # outlive the API. No add_header here, so the server-level ones still apply.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Dotfiles and editor droppings never exist in dist/; say so instead of
  # answering with the SPA shell, which reads as "found" to scanners.
  location = /.well-known/security.txt { }
  location ~ /\. { return 404; }

  # Form intake, same origin so the CSP needs no connect-src exception. The
  # API listens on loopback inside this container and is never exposed.
  location /api/ {
    limit_req zone=kerniva_forms burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    client_body_buffer_size 8k;

    # Must match FORMS_API_PORT in the Dockerfile; the API binds loopback only.
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $kerniva_client_ip;
    proxy_set_header Origin $http_origin;
    proxy_set_header Connection "";
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
  }

  # The product itself lives on its own origin. /live is the short address
  # people are given, so it has to be answered here, before the SPA: a router
  # link could not leave this origin. No add_header, so the server-level ones
  # still apply. 302, not 301: browsers cache a permanent redirect for good.
  location = /live { return 302 https://live.kerniva.app/; }
  location /live/ { return 302 https://live.kerniva.app/; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
