# kerniva.app behind Cloudflare → Coolify/Traefik. / is the static site,
# /try/ the simulation build, /try/api/ the simulation API (service "api" on
# the compose network).
# nginx discards server-level add_header inside a location that sets its own,
# so Cache-Control is chosen by a map and every header is declared once here.
map $uri $kerniva_cache_control {
  ~^/(try/)?assets/  "public, max-age=31536000, immutable";
  default            "no-cache";
}

# Keep crawlers out of the simulation at the header level too; robots.txt
# only covers the polite ones.
map $uri $kerniva_robots_tag {
  ~^/try  "noindex, nofollow, noarchive";
  default "";
}

# Origin-side rate limits keyed on the visitor IP Cloudflare hands us (the
# VM firewall only admits Cloudflare, so the header is trustworthy). These
# sit under the Cloudflare WAF rules as a second layer, not a replacement.
map $http_cf_connecting_ip $kerniva_client {
  ""      $binary_remote_addr;
  default $http_cf_connecting_ip;
}
limit_req_zone $kerniva_client zone=try_api:10m   rate=4r/s;
limit_req_zone $kerniva_client zone=try_mint:10m  rate=10r/m;
limit_req_status 429;

# Scripted clients and AI crawlers get nothing from the API. Browsers always
# send a User-Agent; an empty one is a script by definition.
map $http_user_agent $kerniva_blocked_ua {
  default 0;
  ""      1;
  ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|anthropic-ai|CCBot|Google-Extended|PerplexityBot|Bytespider|Amazonbot|meta-externalagent|Diffbot|cohere-ai|AI2Bot|PetalBot) 1;
  ~*(python-requests|python-urllib|aiohttp|httpx|go-http-client|java/|libwww-perl|scrapy|wget|curl/) 1;
}

server {
  listen 80;
  server_name kerniva.app www.kerniva.app _;
  server_tokens off;

  if ($host = www.kerniva.app) { return 301 https://kerniva.app$request_uri; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Cache-Control $kerniva_cache_control always;
  add_header X-Robots-Tag $kerniva_robots_tag always;

  location = /try { return 301 /try/; }

  # Sandbox minting is the expensive call (a new org + project + template
  # copy): 10/min per IP here, 10/hour per IP in the API and at Cloudflare.
  location = /try/api/v1/sandbox {
    if ($kerniva_blocked_ua) { return 403; }
    limit_req zone=try_mint burst=3 nodelay;
    limit_req zone=try_api  burst=10 nodelay;
    proxy_pass http://api:4100/v1/sandbox;
    include /etc/nginx/kerniva-proxy.inc;
  }

  location /try/api/ {
    if ($kerniva_blocked_ua) { return 403; }
    limit_req zone=try_api burst=40 nodelay;
    proxy_pass http://api:4100/;
    include /etc/nginx/kerniva-proxy.inc;
  }

  location /try/assets/ {
    alias /srv/try/assets/;
  }

  location /try/ {
    alias /srv/try/;
    try_files $uri $uri/ /try/index.html;
  }

  location /assets/ {
    root /srv/site;
  }

  location / {
    root /srv/site;
    try_files $uri $uri/ /index.html;
  }
}
