# kerniva.app behind Cloudflare → Coolify/Traefik. Static marketing site only:
# the live simulation is parked behind a waitlist and its /try proxy has been
# removed (restore it from git history when the sandbox stack is hosted).
# nginx discards server-level add_header inside a location that sets its own,
# so Cache-Control is chosen by a map and every header is declared once here.
map $uri $kerniva_cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

server {
  listen 80;
  server_name kerniva.app www.kerniva.app _;
  server_tokens off;
  root /srv/site;

  if ($host = www.kerniva.app) { return 301 https://kerniva.app$request_uri; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Cache-Control $kerniva_cache_control always;

  # Old simulation links land on the waitlist route inside the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
