# kerniva.app behind Cloudflare → Coolify/Traefik. / is the static site,
# /try/ the simulation build, /try/api/ the simulation API (service "api" on
# the compose network).
# nginx discards server-level add_header inside a location that sets its own,
# so Cache-Control is chosen by a map and every header is declared once here.
map $uri $kerniva_cache_control {
  ~^/(try/)?assets/  "public, max-age=31536000, immutable";
  default            "no-cache";
}

server {
  listen 80;
  server_name kerniva.app www.kerniva.app _;
  server_tokens off;

  if ($host = www.kerniva.app) { return 301 https://kerniva.app$request_uri; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Cache-Control $kerniva_cache_control always;

  location = /try { return 301 /try/; }

  location /try/api/ {
    proxy_pass http://api:4100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_read_timeout 180s;
    proxy_buffering off;
    client_max_body_size 12m;
  }

  location /try/assets/ {
    alias /srv/try/assets/;
  }

  location /try/ {
    alias /srv/try/;
    try_files $uri $uri/ /try/index.html;
  }

  location /assets/ {
    root /srv/site;
  }

  location / {
    root /srv/site;
    try_files $uri $uri/ /index.html;
  }
}
